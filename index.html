<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Consultancy Group SA | حالة المشاريع</title>
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap">
<style>
/* Layout: brand side rail on the reading-start edge (right in Arabic, left in English), work area beside it. */
:root{
  --gold:#D9AA28; --gold-ink:#94700F; --gold-soft:#F6E7BC; --cream:#FEF2CE; --paper:#FBF8F1; --surface:#FFFFFF;
  --ink:#252525; --ink-2:#55524B; --muted:#8A8B8C; --line:#E8E0CB; --line-2:#F1EBDB;
  --good:#2E7D4F; --good-bg:#E5F3EA; --warn:#B26A00; --warn-bg:#FFF1D6; --bad:#B3261E; --bad-bg:#FBE4E2; --info:#3D5A80; --info-bg:#E6EDF6;
  --rail:#1F1D19; --rail-ink:#F4EFE3; --rail-muted:#A8A396; --rail-line:#34312A;
  --font:"Tajawal",system-ui,"Segoe UI",Tahoma,Arial,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --gold:#DDB03A; --gold-ink:#E8C35E; --gold-soft:#3A3020; --cream:#2B2519; --paper:#14130F; --surface:#1C1A15;
  --ink:#F1ECDF; --ink-2:#C9C3B4; --muted:#9A968C; --line:#35302A; --line-2:#29261F;
  --good:#6FCB94; --good-bg:#1D3326; --warn:#F0B35A; --warn-bg:#3A2C14; --bad:#F08A80; --bad-bg:#3D1C19; --info:#9DB8DE; --info-bg:#1E2A3A;
  --rail:#0F0E0B; --rail-ink:#F1ECDF; --rail-muted:#8F8A7E; --rail-line:#2A2722; color-scheme:dark }}
:root[data-theme="dark"]{
  --gold:#DDB03A; --gold-ink:#E8C35E; --gold-soft:#3A3020; --cream:#2B2519; --paper:#14130F; --surface:#1C1A15;
  --ink:#F1ECDF; --ink-2:#C9C3B4; --muted:#9A968C; --line:#35302A; --line-2:#29261F;
  --good:#6FCB94; --good-bg:#1D3326; --warn:#F0B35A; --warn-bg:#3A2C14; --bad:#F08A80; --bad-bg:#3D1C19; --info:#9DB8DE; --info-bg:#1E2A3A;
  --rail:#0F0E0B; --rail-ink:#F1ECDF; --rail-muted:#8F8A7E; --rail-line:#2A2722; color-scheme:dark }
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:100%}
/* rail */
.rail{background:var(--rail);color:var(--rail-ink);display:flex;flex-direction:column;gap:22px;padding-block:24px;padding-inline:18px;position:sticky;top:0;height:100vh;height:100dvh;overflow:auto}
.brand{background:#fff;border-radius:12px;padding:12px 14px;display:flex;justify-content:center}
.brand img{height:44px;width:auto;display:block}
.nav{display:flex;flex-direction:column;gap:4px}
.nav-label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--rail-muted);padding-inline:12px;margin-block:6px 2px}
.nav button{all:unset;cursor:pointer;display:grid;grid-template-columns:22px 1fr auto;align-items:center;gap:10px;padding:11px 12px;border-radius:9px;color:var(--rail-ink);font-weight:500}
.nav button:hover{background:#ffffff10}
.nav button:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.nav button[aria-current="page"]{background:var(--gold);color:#1B1A17;font-weight:700}
.nav button[aria-current="page"] .count{background:#1B1A1722;color:#1B1A17}
.nav svg{width:20px;height:20px}
.count{font-size:12px;font-variant-numeric:tabular-nums;background:#ffffff14;color:var(--rail-ink);padding:1px 9px;border-radius:20px}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--rail-line);padding-top:16px}
.lang{display:grid;grid-template-columns:1fr 1fr;background:#ffffff10;border-radius:9px;padding:3px}
.lang button{all:unset;cursor:pointer;text-align:center;padding:7px 0;border-radius:7px;font-size:14px;color:var(--rail-muted)}
.lang button[aria-pressed="true"]{background:var(--rail-ink);color:#1B1A17;font-weight:700}
.lang button:focus-visible{outline:2px solid var(--gold)}
.sync{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--rail-muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.ok{background:#4CC07A;box-shadow:0 0 0 3px #4CC07A33}.dot.wait{background:var(--gold)}.dot.err{background:#E0574C}
/* main */
.main{min-width:0;padding-block:28px 60px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;padding-bottom:18px;border-bottom:2px solid var(--gold)}
.page-head h1{margin:0;font-size:30px;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
.page-head p{margin:4px 0 0;color:var(--ink-2);max-width:68ch}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold-ink);font-weight:700}
.date{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.notice{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px 16px;margin-bottom:18px;color:var(--ink-2)}
.notice.warn{border-color:var(--warn);background:var(--warn-bg);color:var(--ink)}
/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:22px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:2px;border-top:3px solid var(--gold)}
.kpi .l{font-size:13px;color:var(--ink-2);font-weight:500}
.kpi .v{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.dark{background:var(--rail);color:var(--rail-ink);border-color:var(--rail)}.kpi.dark .l{color:var(--rail-muted)}.kpi.dark .v{color:var(--gold)}.kpi.dark .s{color:var(--rail-muted)}
.stages{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-bottom:26px}
.stage{all:unset;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
.stage:hover{border-color:var(--gold)}.stage:focus-visible{outline:2px solid var(--gold)}
.stage .n{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;grid-row:span 2}
.stage .t{font-weight:700}.stage .d{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.stage .go{grid-column:1/-1;font-size:13px;color:var(--gold-ink);font-weight:700}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.panel h2{font-size:17px;margin:0 0 4px;font-weight:700}
.panel .sub{font-size:13px;color:var(--muted);margin:0 0 14px}
.bars{display:flex;flex-direction:column;gap:12px}
.bar-row{display:grid;grid-template-columns:120px 1fr;gap:10px;align-items:center}
.bar-row .name{font-weight:500;font-size:14px}
.bar-track{display:flex;flex-direction:column;gap:3px}
.bar{height:10px;border-radius:5px;background:var(--line-2);position:relative;overflow:hidden}
.bar i{position:absolute;inset-block:0;inset-inline-start:0;border-radius:5px}
.bar-meta{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);margin-top:14px}
.legend span{display:inline-flex;align-items:center;gap:6px}.legend b{width:10px;height:10px;border-radius:3px;display:inline-block}
.list-mini{display:flex;flex-direction:column}
.list-mini button{all:unset;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line-2);align-items:center}
.list-mini button:hover .nm{color:var(--gold-ink)}.list-mini button:focus-visible{outline:2px solid var(--gold)}
.list-mini .nm{font-weight:500;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-mini .cl{font-size:12px;color:var(--muted)}
.list-mini .am{font-weight:700;font-variant-numeric:tabular-nums;color:var(--warn)}
.years{display:flex;align-items:flex-end;gap:8px;height:150px;padding-top:10px}
.years .y{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;height:100%;justify-content:flex-end}
.years .col{width:100%;max-width:36px;background:var(--gold);border-radius:5px 5px 0 0}
.years .y small{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}.years .y b{font-size:12px;font-variant-numeric:tabular-nums}
/* toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.search{flex:1 1 260px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding-inline:12px}
.search input{border:0;background:transparent;outline:0;padding:10px 0;width:100%}
.search:focus-within{border-color:var(--gold)}
select.f{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px 10px;min-width:0;max-width:200px}
select.f:focus{outline:2px solid var(--gold);outline-offset:0}
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:9px;font-weight:700;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--gold)}.btn:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.btn.primary{background:var(--gold);border-color:var(--gold);color:#1B1A17}.btn.primary:hover{filter:brightness(1.05)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent}
.btn[disabled]{opacity:.5;pointer-events:none}
.totals{display:flex;flex-wrap:wrap;gap:8px 22px;background:var(--rail);color:var(--rail-ink);border-radius:var(--r);padding:12px 16px;margin-bottom:12px;font-size:13px}
.totals div{display:flex;flex-direction:column}.totals span{color:var(--rail-muted)}.totals b{color:var(--gold);font-size:16px;font-variant-numeric:tabular-nums}
.table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;min-width:980px;font-size:13.5px}
th{position:sticky;top:0;background:var(--gold);color:#1B1A17;font-weight:700;text-align:start;padding:11px 10px;white-space:nowrap;cursor:pointer;user-select:none;font-size:13px}
th.num,td.num{text-align:end;font-variant-numeric:tabular-nums}
th .arr{opacity:.55;font-size:11px;margin-inline-start:4px}
td{padding:10px;border-bottom:1px solid var(--line-2);vertical-align:top}
tbody tr{cursor:pointer}
tbody tr:nth-child(even){background:color-mix(in srgb,var(--cream) 45%,transparent)}
tbody tr:hover{background:var(--gold-soft)}
tbody tr:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}
td .nm{font-weight:500;min-width:240px;max-width:420px}
td .sm{font-size:12px;color:var(--muted)}
.neg{color:var(--bad)}
.pill{display:inline-block;padding:2px 10px;border-radius:20px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.ongoing{background:var(--info-bg);color:var(--info)}.pill.not_started{background:var(--warn-bg);color:var(--warn)}
.pill.completed{background:var(--good-bg);color:var(--good)}.pill.stopped{background:var(--bad-bg);color:var(--bad)}.pill.other{background:var(--line-2);color:var(--ink-2)}
.progress{height:6px;background:var(--line-2);border-radius:3px;overflow:hidden;margin-top:5px;min-width:70px}.progress i{display:block;height:100%;background:var(--gold)}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.more{display:flex;justify-content:center;padding:14px}
/* drawer */
.scrim{position:fixed;inset:0;background:#0007;z-index:40}
.drawer{position:fixed;inset-block:0;inset-inline-end:0;width:min(560px,100%);background:var(--surface);z-index:41;display:flex;flex-direction:column;box-shadow:0 0 40px #0004;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:18px 20px;border-bottom:2px solid var(--gold)}
.drawer header h2{margin:0;font-size:19px;line-height:1.4}
.drawer .body{padding:18px 20px;overflow:auto;flex:1}
.drawer footer{display:flex;flex-wrap:wrap;gap:10px;padding:14px 20px;border-top:1px solid var(--line);justify-content:flex-end}
.x{all:unset;cursor:pointer;width:34px;height:34px;display:grid;place-items:center;border-radius:8px;flex:none}.x:hover{background:var(--line-2)}.x:focus-visible{outline:2px solid var(--gold)}
dl.kv{display:grid;grid-template-columns:140px 1fr;gap:10px 14px;margin:0}
dl.kv dt{color:var(--muted);font-size:13px}dl.kv dd{margin:0;font-weight:500;font-variant-numeric:tabular-nums;min-width:0;overflow-wrap:anywhere}
.money{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-block:16px}
.money div{background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:10px 12px}
.money span{font-size:12px;color:var(--muted);display:block}.money b{font-size:18px;font-variant-numeric:tabular-nums}
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form .full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:13px;font-weight:700;color:var(--ink-2)}
.field input,.field select,.field textarea{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-width:0;width:100%;box-sizing:border-box}
.field textarea{min-height:64px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--gold);outline-offset:0;border-color:var(--gold)}
.field .hint{font-size:12px;color:var(--muted)}
.inline{display:flex;gap:8px;align-items:center}
.confirm{background:var(--warn-bg);border:1px solid var(--warn);border-radius:9px;padding:12px 14px;margin-top:14px;display:flex;flex-direction:column;gap:10px}
.toast{position:fixed;inset-inline-start:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--rail);color:var(--rail-ink);padding:11px 18px;border-radius:10px;z-index:60;font-weight:500;box-shadow:0 8px 30px #0004;max-width:calc(100% - 32px)}
[dir="rtl"] .toast{transform:translateX(50%)}
/* settings */
.set-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:16px}
.set-row{display:grid;grid-template-columns:1fr 1fr auto auto;gap:8px;align-items:center;margin-bottom:8px}
.set-row input[type=text]{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.chk{display:inline-flex;gap:5px;align-items:center;font-size:12px;color:var(--ink-2);white-space:nowrap}
/* backup */
.bk-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}
.bk-steps{margin:0 0 14px;padding-inline-start:20px;color:var(--ink-2);font-size:14px}.bk-steps li{margin-bottom:4px}
.bk-status{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px;margin:0 0 16px;background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:12px 14px}
.bk-status dt{color:var(--muted)}.bk-status dd{margin:0;font-weight:700;overflow-wrap:anywhere}
.bk-actions{display:flex;flex-wrap:wrap;gap:10px}
.bk-note{font-size:13px;color:var(--muted);margin:12px 0 0}
.bk-due{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.rail-bk{all:unset;cursor:pointer;font-size:11.5px;color:var(--rail-muted)}.rail-bk:hover{color:var(--gold)}.rail-bk.due{color:var(--gold);font-weight:700}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .rail{position:static;height:auto;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));gap:12px}
  .nav{flex-direction:row;overflow-x:auto;gap:6px}.nav-label{display:none}
  .nav button{grid-template-columns:auto auto;white-space:nowrap}.nav button svg{display:none}
  .rail-foot{flex-direction:row;flex-wrap:wrap;align-items:center;margin-top:0;padding-top:10px}
  .brand{justify-content:flex-start;align-self:flex-start}
  .main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 50px}
  .page-head h1{font-size:24px}
  .form{grid-template-columns:1fr}
  dl.kv{grid-template-columns:110px 1fr}
  .bar-row{grid-template-columns:90px 1fr}
}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .18s ease-out}@keyframes slide{from{opacity:.4;translate:0 8px}to{opacity:1;translate:0 0}}}
.mode-tag{font-size:11.5px;color:var(--rail-muted);display:flex;align-items:center;gap:6px}
.mode-tag b{color:var(--gold)}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>
<body>

const DEFAULT_LISTS = {work:[],status:[{k:'not_started',ar:'فى البداية',en:'Starting'},{k:'ongoing',ar:'جارى',en:'Ongoing'},{k:'completed',ar:'منتهى',en:'Completed',moves:true},{k:'stopped',ar:'متوقف',en:'Stopped',moves:true}],sector:[],location:[]};

const S = { lang:'ar', view:'dash', items:new Map(), bucketOf:new Map(), lists:DEFAULT_LISTS, db:null, user:null, canWrite:true, sync:'wait',
  q:'', fWork:'', fStatus:'', fSector:'', fLoc:'', sort:{key:'order',dir:1}, limit:60, drawer:null, names:{} };
try { const l = localStorage.getItem('cg_lang'); if (l==='en'||l==='ar') S.lang=l; } catch(e) {}
const VIEWS = ['dash','current','finished','future','settings','backup'];
const h = location.hash.replace('#',''); if (VIEWS.includes(h)) S.view = h;

const t = k => T[S.lang][k] ?? k;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf0 = new Intl.NumberFormat('en-US',{maximumFractionDigits:0});
const nf2 = new Intl.NumberFormat('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const money = v => (v===null||v===undefined||v==='') ? t('none') : nf2.format(v);
const money0 = v => (v===null||v===undefined) ? t('none') : nf0.format(v);
const short = v => { const a=Math.abs(v||0); if(a>=1e6) return (v/1e6).toFixed(a>=1e8?0:1)+(S.lang==='ar'?' مليون':'M'); if(a>=1e3) return nf0.format(v/1e3)+(S.lang==='ar'?' ألف':'K'); return nf0.format(v||0); };
const num = v => (typeof v==='number' && isFinite(v)) ? v : 0;
const lab = (list,k) => { const it=(S.lists[list]||[]).find(x=>x.k===k); return it ? (it[S.lang]||it.ar||it.en||k) : (k||''); };
const loc = (p,f) => S.lang==='en' ? (p[f+'_en']||p[f+'_ar']||'') : (p[f+'_ar']||p[f+'_en']||'');
const noFin = p => p.stage==='finished' && p.invoiced==null && p.collected==null;
const unc = p => noFin(p) ? null : num(p.invoiced)-num(p.collected);
const rem = p => (noFin(p) || p.value==null) ? null : num(p.value)-num(p.invoiced);
const statusClass = k => ['ongoing','not_started','completed','stopped'].includes(k) ? k : 'other';
const moves = k => !!(S.lists.status||[]).find(s=>s.k===k && s.moves);
const stageItems = st => [...S.items.values()].filter(p=>!p.deleted && p.stage===st);

/* ---------- layout chrome ---------- */
function chrome(){
  const root=document.documentElement; root.dir=T[S.lang].dir; root.lang=S.lang;
  document.getElementById('lang-ar').setAttribute('aria-pressed', S.lang==='ar');
  document.getElementById('lang-en').setAttribute('aria-pressed', S.lang==='en');
  const c = st => stageItems(st).length;
  const btn = (v,cnt) => `<button type="button" data-view="${v}" ${S.view===v?'aria-current="page"':''}>${ICON[v]}<span>${t(v)}</span>${cnt!==undefined?`<span class="count">${cnt}</span>`:'<span></span>'}</button>`;
  document.getElementById('nav').innerHTML = `<div class="nav-label">${t('sections')}</div>${btn('dash')}${btn('current',c('current'))}${btn('finished',c('finished'))}${btn('future',c('future'))}<div class="nav-label">${t('manage')}</div>${btn('settings')}${btn('backup')}`;
  railBackup();
  const dot=document.getElementById('sync-dot'); dot.className='dot '+(S.sync==='ok'?'ok':S.sync==='err'?'err':'wait');
  document.getElementById('sync-text').textContent = S.sync==='ok'?t('live'):S.sync==='err'?t('offline'):S.sync==='nodb'?t('noDb'):t('connecting');
}
function head(v, right=''){
  const d=new Date(); const ds=d.getFullYear()+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getDate()).padStart(2,'0');
  return `<div class="page-head"><div><div class="eyebrow">${S.lang==='ar'?'المجموعة الاستشارية':'Consultancy Group'}</div><h1>${t(v)}</h1><p>${t(v+'D')}</p></div><div class="inline">${right}<span class="date">${ds}</span></div></div>`
   + (S.sync==='nodb'?`<div class="notice warn">${t('noDb')}</div>`:'') + (!S.canWrite && S.sync!=='nodb'?`<div class="notice">${t('readOnly')}</div>`:'');
}

/* ---------- dashboard ---------- */
function viewDash(){
  const cur=stageItems('current'), fin=stageItems('finished'), fut=stageItems('future');
  const sum=(a,f)=>a.reduce((s,p)=>s+num(typeof f==='function'?f(p):p[f]),0);
  const V=sum(cur,'value'), I=sum(cur,'invoiced'), C=sum(cur,'collected'), U=sum(cur,unc), R=sum(cur,rem);
  const rate = I ? Math.round(C/I*100) : 0;
  let html = head('dash');
  if (!S.items.size && S.sync==='ok') html += `<div class="notice">${t('emptyDb')}</div>`;
  html += `<section class="kpis" aria-label="KPIs">
    <div class="kpi dark"><span class="l">${t('activeCount')}</span><span class="v">${cur.length}</span><span class="s">${t('projects')}</span></div>
    <div class="kpi"><span class="l">${t('contractValue')}</span><span class="v">${money0(V)}</span><span class="s">${t('sar')}</span></div>
    <div class="kpi"><span class="l">${t('invoiced')}</span><span class="v">${money0(I)}</span><span class="s">${t('sar')}</span></div>
    <div class="kpi"><span class="l">${t('collected')}</span><span class="v">${money0(C)}</span><span class="s">${t('sar')}</span></div>
    <div class="kpi"><span class="l">${t('uncollected')}</span><span class="v">${money0(U)}</span><span class="s">${t('sar')}</span></div>
    <div class="kpi"><span class="l">${t('remaining')}</span><span class="v">${money0(R)}</span><span class="s">${t('sar')}</span></div>
    <div class="kpi"><span class="l">${t('collRate')}</span><span class="v" style="color:var(--gold-ink)">${rate}%</span><span class="s">${t('ofInvoiced')}</span></div>
  </section>`;
  const stage=(v,arr)=>`<button type="button" class="stage" data-view="${v}"><span class="n">${arr.length}</span><span class="t">${t(v)}</span><span class="d">${money0(sum(arr,'value'))} ${t('sar')}</span><span class="go">${t('open')}</span></button>`;
  html += `<section class="stages">${stage('current',cur)}${stage('finished',fin)}${stage('future',fut)}</section>`;
  // by work type
  const groups={}; cur.forEach(p=>{const k=p.work||'_'; (groups[k] ||= {n:0,v:0,c:0}); groups[k].n++; groups[k].v+=num(p.value); groups[k].c+=num(p.collected);});
  const gArr=Object.entries(groups).sort((a,b)=>b[1].v-a[1].v); const gMax=Math.max(1,...gArr.map(g=>g[1].v));
  const bars = gArr.length ? gArr.map(([k,g])=>`<div class="bar-row"><div class="name">${esc(k==='_'?t('none'):lab('work',k))}<div class="sm" style="font-size:12px;color:var(--muted)">${g.n} ${t('projects')}</div></div><div class="bar-track">
     <div class="bar"><i style="width:${g.v/gMax*100}%;background:var(--ink)"></i></div><div class="bar"><i style="width:${g.c/gMax*100}%;background:var(--gold)"></i></div>
     <div class="bar-meta"><span>${short(g.v)}</span><span>${short(g.c)}</span></div></div></div>`).join('') : `<div class="empty">${t('none')}</div>`;
  // top uncollected
  const top=cur.filter(p=>num(unc(p))>0).sort((a,b)=>unc(b)-unc(a)).slice(0,6);
  const topHtml = top.length ? top.map(p=>`<button type="button" data-open="${p.id}"><div style="min-width:0"><div class="nm">${esc(loc(p,'name'))}</div><div class="cl">${esc(loc(p,'client'))}</div></div><span class="am">${money0(unc(p))}</span></button>`).join('') : `<div class="empty">${t('none')}</div>`;
  // finished by year
  const yrs={}; fin.forEach(p=>{const y=(p.end||p.start||'').slice(0,4); if(/^\d{4}$/.test(y)) yrs[y]=(yrs[y]||0)+1;});
  const yArr=Object.entries(yrs).sort((a,b)=>a[0].localeCompare(b[0])).slice(-10); const yMax=Math.max(1,...yArr.map(y=>y[1]));
  const yHtml = yArr.map(([y,n])=>`<div class="y"><b>${n}</b><div class="col" style="height:${Math.max(4,n/yMax*110)}px"></div><small>${y}</small></div>`).join('');
  html += `<section class="grid2">
    <div class="panel"><h2>${t('byWork')}</h2><p class="sub">${t('byWorkS')}</p><div class="bars">${bars}</div>
      <div class="legend"><span><b style="background:var(--ink)"></b>${t('contractValue')}</span><span><b style="background:var(--gold)"></b>${t('collected')}</span></div></div>
    <div class="panel"><h2>${t('topOut')}</h2><p class="sub">${t('topOutS')}</p><div class="list-mini">${topHtml}</div></div>
    <div class="panel"><h2>${t('byYear')}</h2><p class="sub">${t('byYearS')}</p><div class="years" dir="ltr">${yHtml||`<div class="empty">${t('none')}</div>`}</div></div>
  </section>`;
  return html;
}

/* ---------- lists ---------- */
function columns(st){
  const base=[{k:'order',l:'no',num:true,v:p=>p.no||''},{k:'contract',l:'contract',v:p=>p.contract||''},{k:'name',l:'name'},{k:'client',l:'client'},{k:'work',l:'work'}];
  if(st==='finished') return [...base,{k:'sector',l:'sector'},{k:'location',l:'location'},{k:'value',l:'value',num:true},{k:'start',l:'start'},{k:'end',l:'end'}];
  return [...base,{k:'status',l:'status'},{k:'start',l:'start'},{k:'value',l:'value',num:true},{k:'invoiced',l:'invoiced',num:true},{k:'collected',l:'collected',num:true},{k:'unc',l:'uncollected',num:true},{k:'rem',l:'remaining',num:true}];
}
function sortVal(p,k){ if(k==='name'||k==='client') return loc(p,k).toLowerCase(); if(k==='unc') return unc(p)??-Infinity; if(k==='rem') return rem(p)??-Infinity;
  if(k==='work') return lab('work',p.work); if(k==='status') return lab('status',p.status); if(k==='sector') return lab('sector',p.sector); if(k==='location') return lab('location',p.location);
  const v=p[k]; return v==null?'':v; }
function filtered(st){
  const q=S.q.trim().toLowerCase();
  let a=stageItems(st).filter(p=>(!S.fWork||p.work===S.fWork)&&(!S.fStatus||p.status===S.fStatus)&&(!S.fSector||p.sector===S.fSector)&&(!S.fLoc||p.location===S.fLoc)
    &&(!q||[p.name_ar,p.name_en,p.client_ar,p.client_en,p.contract,p.no].some(x=>String(x||'').toLowerCase().includes(q))));
  const {key,dir}=S.sort; a.sort((x,y)=>{const A=sortVal(x,key),B=sortVal(y,key); return (A>B?1:A<B?-1:0)*dir || (num(x.order)-num(y.order));});
  return a;
}
function opts(list,cur,allKey){ return `<option value="">${t(allKey)}</option>`+(S.lists[list]||[]).map(o=>`<option value="${esc(o.k)}" ${o.k===cur?'selected':''}>${esc(o[S.lang]||o.ar)}</option>`).join(''); }
function viewList(st){
  const cols=columns(st), rows=filtered(st), all=stageItems(st);

    + (st!=='finished'?`<div><span>${t('invoiced')}</span><b>${money0(sum('invoiced'))}</b></div><div><span>${t('collected')}</span><b>${money0(sum('collected'))}</b></div><div><span>${t('uncollected')}</span><b>${money0(sum(unc))}</b></div><div><span>${t('remaining')}</span><b>${money0(sum(rem))}</b></div>`:'')+`</div>`;
  const th=cols.map(c=>`<th scope="col" class="${c.num?'num':''}" data-sort="${c.k}">${t(c.l)}${S.sort.key===c.k?`<span class="arr">${S.sort.dir>0?'▲':'▼'}</span>`:''}</th>`).join('');
  const cell=(p,c)=>{ switch(c.k){
    case 'order': return `<td class="num">${esc(p.no||'')}</td>`;
    case 'contract': return `<td><span dir="ltr">${esc(p.contract||'')}</span></td>`;
    case 'name': return `<td><div class="nm">${esc(loc(p,'name'))}</div></td>`;
    case 'client': return `<td>${esc(loc(p,'client'))}</td>`;
    case 'work': return `<td>${esc(lab('work',p.work))}</td>`;
    case 'sector': return `<td>${esc(lab('sector',p.sector))}</td>`;
    case 'location': return `<td>${esc(lab('location',p.location))}</td>`;
    case 'status': return `<td><span class="pill ${statusClass(p.status)}">${esc(lab('status',p.status))}</span></td>`;
    case 'start': case 'end': return `<td class="num" dir="ltr">${esc(p[c.k]||'')}</td>`;
    case 'invoiced': { const pc = p.value ? Math.min(100,Math.max(0,num(p.invoiced)/p.value*100)) : 0; return `<td class="num">${money(p.invoiced)}<div class="progress" title="${Math.round(pc)}%"><i style="width:${pc}%"></i></div></td>`; }
    case 'unc': { const v=unc(p); return `<td class="num ${v<0?'neg':''}">${money(v)}</td>`; }
    case 'rem': { const v=rem(p); return `<td class="num ${v<0?'neg':''}">${money(v)}</td>`; }
    default: return `<td class="num">${money(p[c.k])}</td>`; } };
  const body = rows.slice(0,S.limit).map(p=>`<tr tabindex="0" data-open="${p.id}">${cols.map(c=>cell(p,c)).join('')}</tr>`).join('');
  html += `<div class="table-wrap"><table><thead><tr>${th}</tr></thead><tbody>${body}</tbody></table>${rows.length?'':`<div class="empty">${all.length?t('noResults'):t('emptyDb')}</div>`}</div>`;
  if (rows.length>S.limit) html += `<div class="more"><button type="button" class="btn" data-act="more">${t('showMore')} (${rows.length-S.limit})</button></div>`;
  return html;
}

/* ---------- data writes ---------- */
async function writeProject(id, data){
  if (!S.db) throw new Error('nodb');
  const meta = { updatedAt: new Date().toISOString(), updatedFrom: ADMIN ? 'admin' : 'web' };
  await S.db.collection(COL_PROJECTS).doc(id).set({...data,...meta},{merge:true});
}
function saveBlob(blob, filename){
  const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); },1500);
}
function readForm(){
  const F=document.getElementById('pform'); const g=k=>F.elements[k]?.value?.trim() ?? '';
  const n=k=>{ const v=g(k); if(v==='') return null; const x=Number(v.replace(/,/g,'')); return isFinite(x)?x:null; };
  return { name_ar:g('name_ar'), name_en:g('name_en'), client_ar:g('client_ar'), client_en:g('client_en'), stage:g('stage'), status:g('status'), contract:g('contract'), no:g('no'),
    work:g('work'), sector:g('sector'), location:g('location'), start:g('start'), end:g('end'), value:n('value'), invoiced:n('invoiced'), collected:n('collected'), notes_ar:g('notes_ar'), notes_en:g('notes_en') };
}
async function save(){
  const d=readForm(); if(!d.name_ar && !d.name_en){ toast(t('needName')); return; }
  let movedNow=false; if (moves(d.status) && d.stage!=='finished'){ d.stage='finished'; movedNow=true; }
  const isNew = S.drawer.mode==='new'; const id = isNew ? 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6) : S.drawer.id;
  if (isNew){ const max=Math.max(0,...[...S.items.values()].map(p=>num(p.order))); d.order=max+1; }
  const btn=document.querySelector('[data-act="save"]'); if(btn) btn.disabled=true;
  try { await writeProject(id,d); toast(movedNow?t('moved'):t('saved')); S.drawer={mode:'view',id,confirmDel:false}; renderDrawer(); }
  catch(e){ if(btn) btn.disabled=false; toast(e && e.code==='invalid_argument' ? t('noWrite') : t('saveFail')); if(e && e.code==='invalid_argument'){ S.canWrite=false; render(); } }
}
async function del(){
  const id=S.drawer.id; try{ await writeProject(id,{deleted:true}); closeDrawer(); toast(t('deleted')); }catch(e){ toast(t('saveFail')); }
}
async function translate(){
  const b=document.getElementById('trbtn'); const F=document.getElementById('pform');
  const src={name:F.elements.name_ar.value.trim(),client:F.elements.client_ar.value.trim(),notes:F.elements.notes_ar.value.trim()};
  if(!src.name && !src.client && !src.notes) return;
  b.disabled=true; b.textContent=t('translating');
  try{
    const sample = await window.claude?.use?.('sample'); if(!sample) throw new Error('na');
    const out = await sample.json(`Translate these Arabic fields from a Saudi engineering consultancy's project register into concise professional English. Keep codes, plot and plan numbers, and Latin text as they are. Transliterate personal and company names in standard Saudi spelling. Return JSON {"name":string,"client":string,"notes":string}; use "" for empty inputs.\n${JSON.stringify(src)}`, {modelTier:'quick'});
    if(out && typeof out==='object'){ if(out.name && !F.elements.name_en.value) F.elements.name_en.value=out.name; else if(out.name) F.elements.name_en.value=out.name;
      if(out.client) F.elements.client_en.value=out.client; if(out.notes) F.elements.notes_en.value=out.notes; }
  }catch(e){ toast(t('transFail')); }
  b.disabled=false; b.textContent=t('translate');
}
async function exportCsv(){
  const st=S.view, rows=filtered(st), cols=columns(st);
  const val=(p,c)=>{ switch(c.k){ case 'order':return p.no||''; case 'name':return loc(p,'name'); case 'client':return loc(p,'client'); case 'work':return lab('work',p.work); case 'status':return lab('status',p.status);
    case 'sector':return lab('sector',p.sector); case 'location':return lab('location',p.location); case 'unc':return unc(p)??''; case 'rem':return rem(p)??''; default: return p[c.k]??''; } };
  const q=v=>{ const s=String(v); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
  const csv='﻿'+[cols.map(c=>q(t(c.l))).join(','),...rows.map(p=>cols.map(c=>q(val(p,c))).join(','))].join('\r\n');
  try{
    const d=new Date(); saveBlob(new Blob([csv],{type:'text/csv;charset=utf-8'}), `${S.lang==='ar'?{current:'المشاريع الجارية',finished:'المشاريع المنتهية',future:'المشاريع المستقبلية'}[st]:{current:'Current Projects',finished:'Completed Projects',future:'Future Projects'}[st]} ${d.toISOString().slice(0,10)}.csv`); toast(t('exported')); }
  catch(e){ toast(t('exportFail')); }
}

      const shown = isNum && c.k!=='order' ? (v===''?'—':nf2.format(v)) : esc(v);
      return `<td class="${isNum?'n':''} ${neg?'neg':''}" ${['start','end','contract'].includes(c.k)?'dir="ltr"':''} ${c.k==='name'?'style="min-width:230px"':''}>${shown}</td>`; };
    const totRow=`<tr class="tot">${cols.map((c,i)=>{ if(i===0) return `<td colspan="1">${t('total')}</td>`; if(!c.num||c.k==='order') return '<td></td>'; const f=c.k==='unc'?unc:c.k==='rem'?rem:c.k; return `<td class="n">${nf2.format(sumF(f))}</td>`; }).join('')}</tr>`;
    // measure row heights once with the full table at page width
    box.innerHTML=css+`<div class="pg" style="height:auto">${head}${summary}<table>${thead}<tbody>${rows.map(p=>`<tr>${cols.map(c=>td(p,c)).join('')}</tr>`).join('')}${totRow}</tbody></table></div>`;
    const trs=[...box.querySelectorAll('tbody tr')]; const hs=trs.map(r=>r.getBoundingClientRect().height);
    const thH=box.querySelector('thead').getBoundingClientRect().height, hdH=box.querySelector('.hd').getBoundingClientRect().height+12, smH=box.querySelector('.sum').getBoundingClientRect().height+10;
    const avail1=H-2*PAD-hdH-smH-thH-34, availN=H-2*PAD-hdH-thH-34;
    const pages=[]; let cur=[], used=0, cap=avail1;
    hs.forEach((h,i)=>{ if(cur.length && used+h>cap){ pages.push(cur); cur=[]; used=0; cap=availN; } cur.push(i); used+=h; });
    if(cur.length) pages.push(cur); if(!pages.length) pages.push([]);
    const { jsPDF } = window.jspdf; const pdf=new jsPDF({orientation:'landscape',unit:'mm',format:'a4',compress:true});
    const company = S.lang==='ar' ? 'المجموعة الاستشارية | Consultancy Group' : 'Consultancy Group | المجموعة الاستشارية';
    for(let pi=0; pi<pages.length; pi++){
      note.textContent=`${t('pdfBuilding')} ${pi+1} / ${pages.length}`;
      const body=pages[pi].map(i=> i<rows.length ? `<tr>${cols.map(c=>td(rows[i],c)).join('')}</tr>` : totRow).join('');
      box.innerHTML=css+`<div class="pg">${head}${pi===0?summary:''}<table>${thead}<tbody>${body}</tbody></table><div class="ft"><span>${company}</span><span>${t('page')} ${pi+1} / ${pages.length}</span></div></div>`;
      const canvas=await window.html2canvas(box.firstElementChild.nextElementSibling||box.querySelector('.pg'),{scale:2,backgroundColor:'#ffffff',logging:false,useCORS:true,width:W,height:H,windowWidth:W});
      if(pi>0) pdf.addPage('a4','landscape');
      pdf.addImage(canvas.toDataURL('image/jpeg',0.9),'JPEG',0,0,297,210,undefined,'FAST');
    }
    const nm=S.lang==='ar'?{current:'المشاريع الجارية',finished:'المشاريع المنتهية',future:'المشاريع المستقبلية'}[st]:{current:'Current Projects',finished:'Completed Projects',future:'Future Projects'}[st];
    saveBlob(pdf.output('blob'), `${nm} ${d.toISOString().slice(0,10)}.pdf`);
    toast(t('exported'));
  }catch(e){ toast(t('pdfFail')); }
  finally{ box.remove(); note.remove(); pdfBusy=false; }
}
function cellText(p,c){ switch(c.k){ case 'order':return p.no||''; case 'name':return loc(p,'name'); case 'client':return loc(p,'client'); case 'work':return lab('work',p.work); case 'status':return lab('status',p.status);
  case 'sector':return lab('sector',p.sector); case 'location':return lab('location',p.location); case 'unc':{const v=unc(p);return v==null?'':v;} case 'rem':{const v=rem(p);return v==null?'':v;} default: return p[c.k]??''; } }
async function saveLists(){
  document.querySelectorAll('[data-l]').forEach(el=>{ const o=draftLists[el.dataset.l][+el.dataset.i]; if(!o) return; if(el.dataset.f==='moves') o.moves=el.checked; else o[el.dataset.f]=el.value.trim(); });
  for (const k of Object.keys(draftLists)) draftLists[k]=draftLists[k].filter(o=>o.ar||o.en);
  try{ await S.db.collection(COL_SETTINGS).doc('lists').set(draftLists); toast(t('saved')); draftLists=null; }
  catch(e){ toast(e && e.code==='invalid_argument'?t('noWrite'):t('saveFail')); }
}

/* ---------- backups on this computer ----------
   Each backup = two files with the date: a .json (full data, used by Restore)
   and a .csv that opens in Excel. Where the browser supports it, files go into
   a folder the user picks once (handle kept in IndexedDB); otherwise they are
   downloaded. A copy is saved automatically once a day while the app is open. */
const BK_APP='cgsa-project-status';
const bkFs = typeof window.showDirectoryPicker === 'function';
const lsGet = k => { try{ return localStorage.getItem(k); }catch(e){ return null; } };
const lsSet = (k,v) => { try{ localStorage.setItem(k,v); }catch(e){} };
const todayStr = () => { const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const BK = { dir:null, perm:'none', restore:null, busy:false, autoTried:false };
function idb(){ return new Promise((res,rej)=>{ const r=indexedDB.open('cgsa_backup',1); r.onupgradeneeded=()=>r.result.createObjectStore('kv'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function idbGet(k){ const db=await idb(); return new Promise(res=>{ const q=db.transaction('kv').objectStore('kv').get(k); q.onsuccess=()=>res(q.result); q.onerror=()=>res(null); }); }
async function idbSet(k,v){ const db=await idb(); return new Promise(res=>{ const tx=db.transaction('kv','readwrite'); tx.objectStore('kv').put(v,k); tx.oncomplete=()=>res(); tx.onerror=()=>res(); }); }
async function bkLoadDir(){
  if(!bkFs) return;
  try{ BK.dir = await idbGet('dir') || null; if(BK.dir) BK.perm = await BK.dir.queryPermission({mode:'readwrite'}); }catch(e){ BK.dir=null; }
}
function bkLast(){ return lsGet('cg_bk_last') || ''; }
function bkAutoOn(){ return lsGet('cg_bk_auto') !== '0'; }
function fmtStamp(iso){ if(!iso) return ''; const d=new Date(iso); return d.getFullYear()+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getDate()).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function railBackup(){
  const el=document.getElementById('rail-bk'); if(!el) return;
  const last=bkLast(); const due = !last || last.slice(0,10)!==todayStr();
  el.className='rail-bk'+(due?' due':'');
  el.textContent = !last ? t('bkRailNever') : due ? t('bkRailDue') : t('bkRailOk')+' '+fmtStamp(last);
}
function bkData(){
  const projects=[...S.items.values()].map(p=>({...p}));
  return { app:BK_APP, version:1, savedAt:new Date().toISOString(), savedFrom: ADMIN?'desktop':'web', projects, lists:S.lists };
}
function bkCsv(data){
  const L=(list,k)=>{ const it=(data.lists[list]||[]).find(x=>x.k===k); return it ? (it.ar||it.en||k) : (k||''); };
  const stage={current:'جارية',finished:'منتهية',future:'مستقبلية'};
  const cols=[['القسم',p=>stage[p.stage]||p.stage],['م',p=>p.no],['رقم العقد',p=>p.contract],['اسم المشروع',p=>p.name_ar],['Project',p=>p.name_en],['العميل',p=>p.client_ar],['Client',p=>p.client_en],
    ['نوع العمل',p=>L('work',p.work)],['الحالة',p=>L('status',p.status)],['القطاع',p=>L('sector',p.sector)],['المدينة',p=>L('location',p.location)],['تاريخ البداية',p=>p.start],['تاريخ النهاية',p=>p.end],
    ['قيمة المشروع',p=>p.value],['المستخلصات المرفوعة',p=>p.invoiced],['المبالغ المحصلة',p=>p.collected],['غير المحصل',p=>unc(p)],['الباقي',p=>rem(p)],['ملاحظات',p=>p.notes_ar],['Notes',p=>p.notes_en]];
  const q=v=>{ const s=String(v??''); return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
  const order={current:0,future:1,finished:2};
  const rows=data.projects.filter(p=>!p.deleted).sort((a,b)=>(order[a.stage]??9)-(order[b.stage]??9)||num(a.order)-num(b.order));
  return '﻿'+[cols.map(c=>q(c[0])).join(','),...rows.map(p=>cols.map(c=>q(c[1](p))).join(','))].join('\r\n');
}
async function bkEnsurePerm(interactive){
  if(!BK.dir) return false;
  try{
    let p=await BK.dir.queryPermission({mode:'readwrite'});
    if(p!=='granted' && interactive) p=await BK.dir.requestPermission({mode:'readwrite'});
    BK.perm=p; return p==='granted';
  }catch(e){ BK.perm='none'; return false; }
}
async function bkPickDir(){
  try{
    const dir=await window.showDirectoryPicker({id:'cgsa-backup',mode:'readwrite',startIn:'documents'});
    BK.dir=dir; await idbSet('dir',dir); lsSet('cg_bk_folder',dir.name); lsSet('cg_bk_auto','1');
    BK.perm = await dir.queryPermission({mode:'readwrite'});
    return true;
  }catch(e){ return false; }
}
async function writeFile(dir,name,text){ const fh=await dir.getFileHandle(name,{create:true}); const w=await fh.createWritable(); await w.write(text); await w.close(); }
// interactive: started by a click (may open the folder picker / permission prompt)
async function bkSave({interactive=false, tag=''}={}){
  if(S.sync!=='ok'){ if(interactive) toast(t('bkWait')); return false; }
  if(BK.busy) return false; BK.busy=true;
  try{
    const data=bkData(); const json=JSON.stringify(data,null,1); const csv=bkCsv(data);
    const d=new Date(); const stamp = tag ? todayStr()+' '+String(d.getHours()).padStart(2,'0')+'-'+String(d.getMinutes()).padStart(2,'0')+' '+tag : todayStr();
    const base='حالة المشاريع - نسخة احتياطية '+stamp;
    if(bkFs){
      if(!BK.dir){ if(!interactive || !(await bkPickDir())) return false; }
      if(!(await bkEnsurePerm(interactive))){ if(interactive) toast(t('bkFail')); return false; }
      await writeFile(BK.dir, base+'.json', json);
      await writeFile(BK.dir, base+' (Excel).csv', csv);
    } else {
      if(!interactive) return false;
      saveBlob(new Blob([json],{type:'application/json'}), base+'.json');
      saveBlob(new Blob([csv],{type:'text/csv;charset=utf-8'}), base+' (Excel).csv');
    }
    lsSet('cg_bk_last', data.savedAt);
    if(interactive && !tag) toast(t('bkSaved'));
    return true;
  }catch(e){ if(interactive) toast(t('bkFail')); return false; }
  finally{ BK.busy=false; chrome(); if(S.view==='backup') render(); }
}
async function bkAuto(){
  if(BK.autoTried || S.sync!=='ok' || !bkFs || !bkAutoOn()) return;
  BK.autoTried=true;
  await bkLoadDir();
  if(!BK.dir) return;
  if(bkLast().slice(0,10)===todayStr()) return;
  await bkSave({interactive:false});
  if(S.view==='backup') render();
}
function viewBackup(){
  const last=bkLast(); const due=!last || last.slice(0,10)!==todayStr();
  const folder = bkFs ? (BK.dir ? BK.dir.name : (lsGet('cg_bk_folder')||'')) : '';
  const saveP = `<div class="panel"><h2>${t('bkSaveT')}</h2><p class="sub">${t('bkSaveS')}</p>
    ${bkFs ? `<ol class="bk-steps"><li>${t('bkStep1')}</li><li>${t('bkStep2')}</li><li>${t('bkStep3')}</li></ol>` : `<div class="notice">${t('bkNoFs')}</div>`}
    <dl class="bk-status">
      ${bkFs?`<dt>${t('bkFolder')}</dt><dd>${folder?esc(folder):t('bkNoFolder')}</dd>`:''}
      <dt>${t('bkLast')}</dt><dd>${last?fmtStamp(last):t('bkNever')}</dd>
      ${bkFs?`<dt>${t('bkAuto')}</dt><dd>${BK.dir && bkAutoOn()?t('bkAutoOn'):t('bkAutoOff')}</dd>`:''}
    </dl>
    ${due && last ? `<div class="notice warn">${t('bkDue')}</div>` : ''}
    ${bkFs && BK.dir && BK.perm!=='granted' ? `<div class="notice warn">${t('bkNeedPerm')}</div>` : ''}
    <div class="bk-actions">
      <button type="button" class="btn primary" data-act="bknow">${t('bkNow')}</button>
      ${bkFs?`<button type="button" class="btn" data-act="bkpick">${BK.dir?t('bkChange'):t('bkPick')}</button>`:''}
      ${bkFs && BK.dir?`<button type="button" class="btn ghost" data-act="bkauto">${bkAutoOn()?t('bkAutoToggleOff'):t('bkAutoToggleOn')}</button>`:''}
    </div>
    <p class="bk-note">${t('bkFiles')}</p></div>`;
  const r=BK.restore;
  let restoreBody='';
  if(r){
    const c=st=>r.data.projects.filter(p=>!p.deleted && p.stage===st).length;
    restoreBody = `<div class="confirm"><div><b>${esc(r.name)}</b><br>${t('bkPreview')} ${fmtStamp(r.data.savedAt)} ${t('bkContains')}: ${c('current')} ${t('bkCurrent')} · ${c('finished')} ${t('bkFinished')} · ${c('future')} ${t('bkFuture')}</div>
      <div>${t('bkWarn')}</div>
      <div class="bk-actions"><button type="button" class="btn primary" data-act="bkdorestore" ${BK.busy||!S.canWrite?'disabled':''}>${BK.busy?t('bkRestoring'):t('bkDoRestore')}</button><button type="button" class="btn" data-act="bkcancel">${t('cancel')}</button></div></div>`;
  }
  const restP = `<div class="panel"><h2>${t('bkRestoreT')}</h2><p class="sub">${t('bkRestoreS')}</p>
    <div class="bk-actions"><button type="button" class="btn" data-act="bkchoose" ${S.canWrite?'':'disabled'}>${t('bkChoose')}</button></div>
    <input type="file" id="bk-file" accept=".json,application/json" hidden>
    ${restoreBody}</div>`;
  return head('backup') + `<div class="bk-grid">${saveP}${restP}</div>`;
}
async function bkReadFile(file){
  try{
    const data=JSON.parse(await file.text());
    if(!data || data.app!==BK_APP || !Array.isArray(data.projects) || !data.lists) throw new Error('bad');
    BK.restore={data,name:file.name}; render();
  }catch(e){ BK.restore=null; toast(t('bkBadFile')); render(); }
}
async function bkDoRestore(){
  const r=BK.restore; if(!r || !S.db) return;
  if(S.sync!=='ok'){ toast(t('bkWait')); return; }
  // 1) keep a copy of the current data first
  const kept = await bkSave({interactive:true, tag: S.lang==='ar'?'قبل الاسترجاع':'before restore'});
  if(!kept){ toast(t('bkFail')); return; }
  BK.busy=true; render();
  try{
    const now=new Date().toISOString();
    const keep=new Set(r.data.projects.map(p=>p.id).filter(Boolean));
    const ops=[];
    r.data.projects.forEach(p=>{ if(!p.id) return; const {id,...rest}=p; ops.push(b=>b.set(S.db.collection(COL_PROJECTS).doc(id), rest)); });
    [...S.items.keys()].forEach(id=>{ if(!keep.has(id) && !S.items.get(id).deleted) ops.push(b=>b.set(S.db.collection(COL_PROJECTS).doc(id), {deleted:true, updatedAt:now, updatedFrom:'restore'}, {merge:true})); });
    ops.push(b=>b.set(S.db.collection(COL_SETTINGS).doc('lists'), r.data.lists));
    for(let i=0;i<ops.length;i+=400){ const b=S.db.batch(); ops.slice(i,i+400).forEach(f=>f(b)); await b.commit(); }
    BK.restore=null; toast(t('bkRestored'));
  }catch(e){ toast(t('bkRestoreFail')); }
  finally{ BK.busy=false; render(); }
}

/* ---------- events ---------- */
document.addEventListener('click', e=>{
  const v=e.target.closest('[data-view]'); if(v){ go(v.dataset.view); return; }
  const o=e.target.closest('[data-open]'); if(o){ openDrawer('view',o.dataset.open); return; }
  const s=e.target.closest('th[data-sort]'); if(s){ const k=s.dataset.sort; S.sort = S.sort.key===k ? {key:k,dir:-S.sort.dir} : {key:k,dir:1}; render(); return; }
  const ln=e.target.closest('[data-lang]'); if(ln){ S.lang=ln.dataset.lang; try{localStorage.setItem('cg_lang',S.lang);}catch(err){} draftLists=null; render(); renderDrawer(); return; }
  const rm=e.target.closest('[data-rm]'); if(rm){ syncDraft(); const [k,i]=rm.dataset.rm.split(':'); draftLists[k].splice(+i,1); render(); return; }
  const al=e.target.closest('[data-addl]'); if(al){ syncDraft(); const k=al.dataset.addl; draftLists[k].push({k:k.slice(0,3)+'_'+Date.now().toString(36),ar:'',en:''}); render(); return; }
  const a=e.target.closest('[data-act]'); if(!a) return;
  ({ add:()=>openDrawer('new'), close:closeDrawer, edit:()=>{S.drawer.mode='edit';renderDrawer();}, back:()=>{S.drawer.mode='view';renderDrawer();},
     save, askdel:()=>{S.drawer.confirmDel=true;renderDrawer();}, nodel:()=>{S.drawer.confirmDel=false;renderDrawer();}, dodel:del, translate,
     export:exportCsv, pdf:exportPdf, more:()=>{S.limit+=100;render();}, savelists:saveLists,
     bknow:()=>bkSave({interactive:true}), bkpick:async()=>{ if(await bkPickDir()) await bkSave({interactive:true}); render(); },
     bkauto:()=>{ lsSet('cg_bk_auto', bkAutoOn()?'0':'1'); render(); }, bkchoose:()=>document.getElementById('bk-file')?.click(),
     bkcancel:()=>{ BK.restore=null; render(); }, bkdorestore:bkDoRestore }[a.dataset.act]||(()=>{}))();
});
function syncDraft(){ document.querySelectorAll('[data-l]').forEach(el=>{ const o=draftLists[el.dataset.l][+el.dataset.i]; if(!o) return; if(el.dataset.f==='moves') o.moves=el.checked; else o[el.dataset.f]=el.value; }); }
document.addEventListener('keydown', e=>{
  if(e.key==='Escape' && S.drawer){ closeDrawer(); return; }
  if(e.key==='Enter' && e.target.matches('tr[data-open]')) openDrawer('view',e.target.dataset.open);
});
let qTimer; document.addEventListener('input', e=>{
  if(e.target.id==='q'){ clearTimeout(qTimer); qTimer=setTimeout(()=>{ S.q=e.target.value; S.limit=60; render(); },180); }
});
document.addEventListener('change', e=>{
  const id=e.target.id; if(['fWork','fStatus','fSector','fLoc'].includes(id)){ S[id]=e.target.value; S.limit=60; render(); }
  if(id==='bk-file' && e.target.files && e.target.files[0]) bkReadFile(e.target.files[0]);
});
window.addEventListener('hashchange',()=>{ const v=location.hash.replace('#',''); if(VIEWS.includes(v) && v!==S.view) go(v); });

/* ---------- connect ---------- */
render();
bkLoadDir().then(()=>{ if(S.view==='backup') render(); });
document.getElementById('mode-tag').innerHTML = ADMIN ? '<b>●</b> '+(S.lang==='ar'?'نسخة سطح المكتب':'Desktop copy') : '';
(()=>{
  let db=null;
  try{ if(!window.firebase) throw new Error('nofb'); const app = firebase.apps.length ? firebase.app() : firebase.initializeApp(FB_CONFIG); db = firebase.firestore(app); }catch(e){}
  if(!db){ S.sync='err'; render(); return; }
  S.db=db;
  let timer=setTimeout(()=>{ if(S.sync!=='ok'){ S.sync='err'; chrome(); } },12000);
  let pending=false; const schedule=()=>{ if(pending) return; pending=true; requestAnimationFrame(()=>{ pending=false; render(); if(S.drawer && S.drawer.mode==='view') renderDrawer(); }); };
  db.collection(COL_PROJECTS).onSnapshot({includeMetadataChanges:true}, snap=>{
    const items=new Map();
    snap.docs.forEach(d=>{ const p=d.data(); if(p) items.set(d.id,{...p,id:d.id}); });
    S.items=items;
    if(!snap.metadata.fromCache){ S.sync='ok'; clearTimeout(timer); setTimeout(bkAuto, 1500); }
    schedule();
  }, err=>{ S.sync='err'; clearTimeout(timer); schedule(); });
  db.collection(COL_SETTINGS).doc('lists').onSnapshot(snap=>{ if(snap.exists){ const d=snap.data(); S.lists={...DEFAULT_LISTS,...d}; } schedule(); }, ()=>{});
  window.addEventListener('online',()=>{ if(S.sync==='err'){ S.sync='wait'; chrome(); } });
})();
})();
</script>
